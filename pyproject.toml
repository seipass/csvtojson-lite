[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "csvtojson-lite"
version = "0.1.0"
description = "Convert CSV rows into JSON records."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
[project.scripts]
csvtojson-lite = "csvtojson_lite.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
